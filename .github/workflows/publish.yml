name: Release and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version (X.Y.Z); blank calculates from Conventional Commits'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: release-management
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'lambdawalker/python.tts.api.client' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.prepare.outputs.created }}
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - name: Prepare local release candidate
        id: prepare
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: uv run python scripts/prepare_release.py --version "$REQUESTED_VERSION"
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.created == 'true'
        with:
          name: release-source
          path: release-candidate.bundle
          if-no-files-found: error
  validate:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Check out the immutable candidate
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/release-candidate.bundle" release-candidate
          git checkout --detach "$RELEASE_SHA"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/docs.py build
      - run: uv run python scripts/docs.py check
      - run: uv run python examples/offline.py
      - name: Validate candidate identity
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          BASE_SHA: ${{ needs.release.outputs.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
      - run: bash scripts/check_artifacts.sh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: tts-api-client-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: error
  finalize:
    needs: [release, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Commit version, tag and create release after all checks pass
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          BASE_SHA: ${{ needs.release.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/release-candidate.bundle" release-candidate
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git fetch origin main --tags
          # Retry only when the previous attempt installed this exact identity.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          else
            test "$(git rev-parse origin/main)" = "$BASE_SHA"
            git push --atomic origin "$RELEASE_SHA:refs/heads/main" "$RELEASE_SHA:refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
  publish:
    needs: [release, validate, finalize]
    if: needs.finalize.result == 'success' && needs.validate.result == 'success' && needs.release.outputs.created == 'true' && github.repository == 'lambdawalker/python.tts.api.client' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-tts-api-client
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/tts-api-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tts-api-client-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  confirm:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
      - run: uv run --no-project python scripts/release.py confirm
      - name: Install exact published version outside checkout
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP"
          uv venv published-check
          uv pip install --python published-check/bin/python "tts-api-client==${RELEASE_TAG#v}"
          published-check/bin/python -I -c 'import tts_api_client; print(tts_api_client.__version__)'
